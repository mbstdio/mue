[workspace]
members = ["crates/mue-core", "crates/mue-app", "crates/mue-shell"]
default-members = ["crates/mue-app", "crates/mue-shell"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_IO",
    "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
] }

[profile.release]
lto = "thin"
strip = "debuginfo"
